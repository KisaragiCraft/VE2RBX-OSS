name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build and verify app
        run: bash script/build_and_run.sh --verify

      - name: Prepare architecture artifact
        shell: bash
        run: |
          cd dist/macos
          rm -f VE2RBX-macOS.zip.sha256
          mv VE2RBX-macOS.zip "VE2RBX-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "VE2RBX-macOS-${{ matrix.arch }}.zip" > "VE2RBX-macOS-${{ matrix.arch }}.zip.sha256"
          shasum -a 256 -c "VE2RBX-macOS-${{ matrix.arch }}.zip.sha256"
          codesign --verify --deep --strict VE2RBX.app

      - uses: actions/upload-artifact@v4
        with:
          name: VE2RBX-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/macos/VE2RBX-macOS-${{ matrix.arch }}.zip
            dist/macos/VE2RBX-macOS-${{ matrix.arch }}.zip.sha256
